name: TwinPixCleanerIOS
options:
  bundleIdPrefix: com.wangjiale
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M7XWC8Q6HN

targets:
  TwinPixCleanerIOS:
    type: application
    platform: iOS
    sources:
      - path: TwinPixIOS
      - path: TwinPixCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangjiale.TwinPixCleanerIOS
        INFOPLIST_FILE: TwinPixIOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: 相册扫描
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: M7XWC8Q6HN
        INFOPLIST_KEY_CFBundleDisplayName: 相册扫描
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 相册扫描会在本机分析照片库中的重复与相似图片，方便你清理多余照片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 相册扫描需要访问照片以管理重复项。
    info:
      path: TwinPixIOS/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 相册扫描
        NSPhotoLibraryUsageDescription: 相册扫描会在本机分析照片库中的重复与相似图片，方便你清理多余照片。
        NSPhotoLibraryAddUsageDescription: 相册扫描需要访问照片以管理重复项。

schemes:
  TwinPixCleanerIOS:
    build:
      targets:
        TwinPixCleanerIOS: all
    run:
      config: Debug
